input {
  udp {
    id => "jscn_syslog_udp_10087"
    host => "0.0.0.0"
    port => "${SYSLOG_UDP_PORT:10087}"
    codec => plain {
      charset => "UTF-8"
    }
    source_ip_fieldname => "source_ip"
    receive_buffer_bytes => 16777216
    workers => 2
    type => "syslog"
  }
}

filter {
  if [type] == "syslog" {
  mutate {
    add_field => {
      "raw_message" => "%{message}"
      "receiver" => "jscn20-logstash"
      "ingest_type" => "syslog"
      "event_family" => "unknown"
      "parse_status" => "received"
    }
  }

  grok {
    id => "syslog_header_parse"
    match => {
      "raw_message" => [
        "^<%{NONNEGINT:syslog_pri}>%{SYSLOGTIMESTAMP:log_time_text}\s+%{YEAR:log_year}\s+%{HOSTNAME:device_name}\s+%{GREEDYDATA:syslog_body}$",
        "^<%{NONNEGINT:syslog_pri}>%{SYSLOGTIMESTAMP:log_time_text}\s+%{HOSTNAME:device_name}\s+%{GREEDYDATA:syslog_body}$",
        "^%{SYSLOGTIMESTAMP:log_time_text}\s+%{YEAR:log_year}\s+%{HOSTNAME:device_name}\s+%{GREEDYDATA:syslog_body}$",
        "^%{SYSLOGTIMESTAMP:log_time_text}\s+%{HOSTNAME:device_name}\s+%{GREEDYDATA:syslog_body}$",
        "^%{TIMESTAMP_ISO8601:log_time_text}\s+%{HOSTNAME:device_name}\s+%{GREEDYDATA:syslog_body}$",
        "^%{GREEDYDATA:syslog_body}$"
      ]
    }
    tag_on_failure => []
  }

  if [log_time_text] {
    if [log_year] {
      mutate {
        add_field => {
          "log_time_parse_text" => "%{log_time_text} %{log_year}"
        }
      }
    } else {
      mutate {
        add_field => {
          "log_time_parse_text" => "%{log_time_text}"
        }
      }
    }

    date {
      id => "syslog_log_time_parse"
      match => ["log_time_parse_text", "MMM  d HH:mm:ss yyyy", "MMM dd HH:mm:ss yyyy", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss", "ISO8601"]
      target => "log_time"
      timezone => "${AIOPS_TIMEZONE:Asia/Shanghai}"
      tag_on_failure => ["_log_time_parse_failed"]
    }
  }

  grok {
    id => "syslog_structured_field_parse"
    match => {
      "syslog_body" => [
        "%%?%{DATA:module}/%{INT:severity}/%{DATA:event_code}(?:\(%{DATA:event_variant}\))?:\s*%{GREEDYDATA:event_detail}",
        "%%?%{DATA:module}/%{WORD:severity}/%{DATA:event_code}:\s*%{GREEDYDATA:event_detail}",
        "%{DATA:module}\[%{DATA:severity}\]\s*%{DATA:event_code}:\s*%{GREEDYDATA:event_detail}"
      ]
    }
    tag_on_failure => ["_syslog_structured_parse_failed"]
  }

  grok {
    id => "syslog_interface_parse"
    match => {
      "raw_message" => [
        "(?i)(?:interface|ifname|port)[:= ]+(?<interface>[A-Za-z][A-Za-z0-9/_ .:-]+)(?:[,; ]|$)",
        "(?i)\b(?<interface>(?:GigabitEthernet|Ten-GigabitEthernet|XGigabitEthernet|HundredGigE|Vlan-interface|Bridge-Aggregation|Eth-Trunk|LoopBack|GE|XGE)[0-9A-Za-z/_.:-]+)\b"
      ]
    }
    tag_on_failure => []
  }

  grok {
    id => "syslog_slot_parse"
    match => {
      "raw_message" => [
        "(?i)(?:slot|board|card)[:= ]+%{DATA:slot}(?:[,; \-]|$)"
      ]
    }
    tag_on_failure => []
  }

  grok {
    id => "syslog_device_ip_parse"
    match => {
      "raw_message" => [
        "(?i)(?:devip|device_ip|device-ip|ip)[:= ]+%{IP:device_ip}(?:[,; \-]|$)"
      ]
    }
    tag_on_failure => []
  }

  if ![device_ip] and [source_ip] {
    mutate {
      add_field => {
        "device_ip" => "%{source_ip}"
      }
    }
  }

  if "_syslog_structured_parse_failed" in [tags] {
    mutate {
      replace => {
        "parse_status" => "partial"
      }
    }
  } else {
    mutate {
      replace => {
        "parse_status" => "parsed"
      }
    }
  }

  if [event_code] =~ /(?i)(link|if|port|interface|vlan)/ or [module] =~ /(?i)(if|ifnet|port|vlan)/ {
    mutate {
      replace => {
        "event_family" => "interface"
      }
    }
  } else if [event_code] =~ /(?i)(optic|transceiver|sfp|laser)/ or [module] =~ /(?i)(optic|transceiver)/ {
    mutate {
      replace => {
        "event_family" => "optical"
      }
    }
  } else if [event_code] =~ /(?i)(ppp|pppoe|aaa|radius)/ or [module] =~ /(?i)(ppp|pppoe|aaa|radius)/ {
    mutate {
      replace => {
        "event_family" => "ppp"
      }
    }
  } else if [event_code] =~ /(?i)(ospf|isis|bgp|route|routing)/ or [module] =~ /(?i)(ospf|isis|bgp|route|routing)/ {
    mutate {
      replace => {
        "event_family" => "routing"
      }
    }
  } else if [event_code] =~ /(?i)(power|fan|temperature|temp)/ or [module] =~ /(?i)(power|fan|temperature|temp)/ {
    mutate {
      replace => {
        "event_family" => "environment"
      }
    }
  }

  mutate {
    remove_field => ["message", "log_time_parse_text"]
  }

  ruby {
    id => "syslog_key_signals_build"
    code => "
      keys = ['device_ip', 'device_name', 'interface', 'event_code', 'event_family']
      values = keys.map { |k| event.get(k) }.compact.reject { |v| v.to_s.empty? || v.to_s.start_with?('%{') }
      event.set('key_signals', values.join('|'))
    "
  }

  if ![log_time] {
    ruby {
      code => "event.set('log_time', event.get('@timestamp'))"
    }
  }
  }
}

output {
  if [type] == "syslog" {
    elasticsearch {
      id => "jscn_syslog_raw_output"
      hosts => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
      index => "${ELASTICSEARCH_SYSLOG_RAW_INDEX_PREFIX:jscn-aiops-syslog-raw}-%{+YYYY.MM.dd}"
    }

    elasticsearch {
      id => "jscn_syslog_parsed_output"
      hosts => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
      index => "${ELASTICSEARCH_SYSLOG_PARSED_INDEX_PREFIX:jscn-aiops-syslog-parsed}-%{+YYYY.MM.dd}"
    }
  }
}
