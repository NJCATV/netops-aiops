input {
  snmptrap {
    id => "jscn_snmptrap_udp_10086"
    host => "0.0.0.0"
    port => "${SNMP_TRAP_UDP_PORT:10086}"
    community => ["${SNMP_TRAP_COMMUNITY:public}"]
    target => "[trap][varbinds]"
    type => "snmptrap"
  }
}

filter {
  if [type] == "snmptrap" {
    mutate {
      rename => {
        "message" => "raw_message"
        "host" => "source_ip"
      }
      add_field => {
        "receiver" => "jscn20-logstash"
        "ingest_type" => "snmptrap"
        "parse_status" => "partial"
      }
    }

    if ![source_ip] and [host][ip] {
      mutate {
        add_field => {
          "source_ip" => "%{[host][ip]}"
        }
      }
    }

    ruby {
      id => "snmptrap_basic_field_extract"
      code => "
        varbinds = event.get('[trap][varbinds]')
        if varbinds.is_a?(Hash)
          event.set('varbind_count', varbinds.length)
          oid_keys = varbinds.keys.map(&:to_s)
          event.set('trap_varbind_oids', oid_keys)

          trap_oid = varbinds['1.3.6.1.6.3.1.1.4.1.0'] || varbinds['SNMPv2-MIB::snmpTrapOID.0'] || varbinds['snmpTrapOID.0']
          event.set('trap_oid', trap_oid.to_s) if trap_oid

          enterprise_oid = nil
          if trap_oid
            parts = trap_oid.to_s.split('.').reject(&:empty?)
            enterprise_oid = parts.first(7).join('.') if parts.length >= 7
          end
          event.set('enterprise_oid', enterprise_oid) if enterprise_oid

          device_name_pair = varbinds.find { |k, _v| k.to_s.end_with?('25506.4.2.2.1.102') }
          event.set('device_name', device_name_pair[1].to_s) if device_name_pair
        end

        raw = event.get('raw_message').to_s
        enterprise = raw.split('@enterprise=[')[1].to_s.split(']').first
        enterprise = nil if enterprise.nil? || enterprise.empty?
        specific = raw[/@specific_trap=([0-9]+)/, 1]
        generic = raw[/@generic_trap=([0-9]+)/, 1]
        source = raw.split('@source_ip=\"')[1].to_s.split('\"').first
        source = nil if source.nil? || source.empty?
        agent = raw[/@agent_addr=.*?@value=\"([^\"]+)\"/, 1]
        if agent && agent.include?('\\x')
          bytes = agent.scan(/\\x([0-9A-Fa-f]{2})/).flatten
          agent = bytes.length == 4 ? bytes.map { |x| x.to_i(16).to_s }.join('.') : nil
        end
        invalid_agent_values = [nil, '', '0.0.0.0', '255.255.255.255']
        valid_agent = agent && (agent =~ /^\d{1,3}(\.\d{1,3}){3}$/) && !invalid_agent_values.include?(agent)

        event.set('enterprise_oid', enterprise) if enterprise && !event.get('enterprise_oid')
        event.set('specific_trap', specific.to_i) if specific
        event.set('generic_trap', generic.to_i) if generic
        event.set('source_ip', source) if source && !event.get('source_ip')
        sender = event.get('source_ip')
        event.set('trap_sender_ip', sender) if sender
        event.set('collector_source_ip', sender) if sender
        event.set('snmp_agent_addr', agent) if valid_agent
        if enterprise && specific && !event.get('trap_oid')
          event.set('trap_oid', enterprise + '.0.' + specific)
        end

        managed_name = event.get('device_name')
        event.set('managed_device_name', managed_name) if managed_name
        if valid_agent
          event.set('managed_device_ip', agent)
          event.set('device_identity_source', 'snmp_agent_addr')
          event.set('device_identity_confidence', 0.95)
        elsif managed_name
          event.set('device_identity_source', 'unknown')
          event.set('device_identity_confidence', 0.0)
        else
          event.set('device_identity_source', 'unknown')
          event.set('device_identity_confidence', 0.0)
        end
        event.set('device_name', event.get('managed_device_name')) if event.get('managed_device_name')
        event.set('device_ip', event.get('managed_device_ip')) if event.get('managed_device_ip')
      "
    }

    if [trap_oid] {
      translate {
        id => "trap_alarm_name_translate"
        source => "trap_oid"
        target => "alarm_name"
        dictionary_path => "/usr/share/logstash/mib/trap_alarm_name.json"
        fallback => ""
        exact => true
        refresh_interval => 300
      }
      translate {
        id => "trap_alarm_severity_translate"
        source => "trap_oid"
        target => "alarm_severity"
        dictionary_path => "/usr/share/logstash/mib/trap_alarm_severity.json"
        fallback => ""
        exact => true
        refresh_interval => 300
      }
      translate {
        id => "trap_alarm_lifecycle_translate"
        source => "trap_oid"
        target => "alarm_lifecycle_status"
        dictionary_path => "/usr/share/logstash/mib/trap_alarm_lifecycle.json"
        fallback => ""
        exact => true
        refresh_interval => 300
      }
      translate {
        id => "trap_alarm_vendor_translate"
        source => "trap_oid"
        target => "alarm_vendor"
        dictionary_path => "/usr/share/logstash/mib/trap_alarm_vendor.json"
        fallback => ""
        exact => true
        refresh_interval => 300
      }
      translate {
        id => "trap_alarm_enterprise_translate"
        source => "trap_oid"
        target => "alarm_enterprise_name"
        dictionary_path => "/usr/share/logstash/mib/trap_alarm_enterprise_name.json"
        fallback => ""
        exact => true
        refresh_interval => 300
      }
      ruby {
        id => "trap_alarm_definition_status"
        code => "
          name = event.get('alarm_name').to_s
          if name && !name.empty?
            event.set('alarm_definition_matched', true)
            event.set('alarm_lookup_source', 'logstash_alarm_dictionary')
          else
            event.set('alarm_definition_matched', false)
            event.remove('alarm_name')
            event.remove('alarm_severity')
            event.remove('alarm_lifecycle_status')
            event.remove('alarm_vendor')
            event.remove('alarm_enterprise_name')
          end
        "
      }

      translate {
        id => "h3c_trap_oid_name_translate"
        source => "trap_oid"
        target => "trap_oid_name"
        dictionary_path => "/usr/share/logstash/mib/h3c_oid_name.json"
        fallback => ""
        exact => true
        refresh_interval => 300
      }
      translate {
        id => "h3c_trap_oid_module_translate"
        source => "trap_oid"
        target => "trap_oid_module"
        dictionary_path => "/usr/share/logstash/mib/h3c_oid_module.json"
        fallback => ""
        exact => true
        refresh_interval => 300
      }
      translate {
        id => "h3c_trap_oid_type_translate"
        source => "trap_oid"
        target => "trap_oid_type"
        dictionary_path => "/usr/share/logstash/mib/h3c_oid_type.json"
        fallback => ""
        exact => true
        refresh_interval => 300
      }
      ruby {
        id => "h3c_trap_mib_translation_status"
        code => "
          name = event.get('trap_oid_name').to_s
          if name && !name.empty?
            event.set('mib_translated', true)
            event.set('mib_lookup_source', 'logstash_dictionary')
          else
            event.set('mib_translated', false)
            event.remove('trap_oid_name')
            event.remove('trap_oid_module')
            event.remove('trap_oid_type')
          end
        "
      }
    }

    mutate {
      add_field => {
        "key_signals" => "%{managed_device_ip}|%{managed_device_name}|%{trap_oid}|%{enterprise_oid}"
      }
    }

    if [key_signals] =~ /%\{/ {
      ruby {
        id => "snmptrap_key_signals_cleanup"
        code => "
          values = ['managed_device_ip', 'managed_device_name', 'trap_sender_ip', 'trap_oid', 'enterprise_oid'].map { |k| event.get(k) }.compact.reject { |v| v.to_s.empty? || v.to_s.start_with?('%{') }
          event.set('key_signals', values.join('|'))
        "
      }
    }
  }
}

output {
  if [type] == "snmptrap" {
    elasticsearch {
      id => "jscn_snmptrap_raw_output"
      hosts => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
      index => "${ELASTICSEARCH_TRAP_RAW_INDEX_PREFIX:jscn-aiops-trap-raw}-%{+YYYY.MM.dd}"
    }
  }
}
